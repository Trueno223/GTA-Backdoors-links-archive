name: Edit Link  
description: Please fill out the following fields to edit a link.  

fields:  
  - name: Link Title  
    required: true  
    description: The title of the link.  
  - name: Link URL  
    required: true  
    description: The URL of the link.  
  - name: Description  
    required: false  
    description: A brief description of the link.  
  - name: Tags  
    required: false  
    description: Any tags associated with the link, separated by commas.  
