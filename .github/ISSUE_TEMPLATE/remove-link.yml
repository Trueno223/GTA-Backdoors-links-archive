name: Remove a link
description: Request the removal of a link from the archive
title: "[REMOVE] "
labels: ["remove-link"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for requesting a link removal! Please fill out the form below.

  - type: textarea
    id: link-description
    attributes:
      label: Link Description
      description: Which link would you like to remove? Provide the description of the link
      placeholder: "e.g., Ultimate SA modding guide"
    validations:
      required: true

  - type: textarea
    id: reason-for-removal
    attributes:
      label: Reason for Removal
      description: Why should this link be removed?
      placeholder: "Optional notes about why this link should be removed..."
    validations:
      required: false